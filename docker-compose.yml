services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Qsr_Queue_Database}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - qsr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      UPLOAD_DIR: /app/videos/input
      PROCESSED_DIR: /app/videos/processed
      EVIDENCE_DIR: /app/evidence
      MODEL_PATH: /app/vision/models/yolo11n.pt
    ports:
      - "8000:8000"
    volumes:
      - ./videos:/app/videos
      - ./evidence:/app/evidence
      - ./vision/models:/app/vision/models:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  analytics-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      UPLOAD_DIR: /app/videos/input
      PROCESSED_DIR: /app/videos/processed
      EVIDENCE_DIR: /app/evidence
      MODEL_PATH: /app/vision/models/yolo11n.pt
    volumes:
      - ./videos:/app/videos
      - ./evidence:/app/evidence
      - ./vision/models:/app/vision/models:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qsr_postgres_data:
